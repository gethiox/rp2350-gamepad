# Builds release artifacts for a version tag (v1.2.3), attaches checksums
# and signed build provenance, and publishes a GitHub release.
#
# Verifying a download: see docs/verifying-releases.md
#   gh attestation verify <file> --repo gethiox/rp2350-gamepad
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"
  VERSION: ${{ github.ref_name }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: configurator/go.sum
      - run: scripts/ci-linux-deps.sh
      - name: Firmware core tests
        run: |
          cmake -S firmware/host -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/host
          ctest --test-dir build/host --output-on-failure
      - name: Configurator tests
        working-directory: configurator
        env:
          RP2350_GAMEPAD_SIM: ${{ github.workspace }}/build/host/rp2350-gamepad-sim
        run: go test -count=1 ./...

  firmware:
    name: Firmware
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Reproducible build
        env:
          GP_VERSION: ${{ env.VERSION }}
        run: scripts/build-firmware.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-firmware
          path: dist/*

  linux:
    name: Configurator ${{ matrix.arch }} Linux
    needs: test
    strategy:
      matrix:
        include:
          # 22.04 = older glibc, so the binary runs on more distributions
          - { arch: amd64, os: ubuntu-22.04 }
          - { arch: arm64, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: configurator/go.sum
      - run: scripts/ci-linux-deps.sh
      - name: Build and package
        run: scripts/package-configurator.sh linux ${{ matrix.arch }} "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*

  windows:
    name: Configurator Windows
    needs: test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: configurator/go.sum
      - name: Build and package
        shell: bash
        run: scripts/package-configurator.sh windows amd64 "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: dist/*

  macos:
    name: Configurator macOS (universal)
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: configurator/go.sum
      - name: Build and package
        run: scripts/package-configurator.sh macos universal "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/*

  publish:
    name: Publish release
    needs: [firmware, linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # create the release
      id-token: write     # sign the provenance (Sigstore)
      attestations: write # store the provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          cp ../packaging/linux/99-rp2350-gamepad.rules ../THIRD_PARTY_NOTICES.md .
          sha256sum -- * | grep -v SHA256SUMS > SHA256SUMS
          cat SHA256SUMS
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease";; esac
          gh release create "$VERSION" dist/* --title "rp2350-gamepad $VERSION" \
            --notes-file packaging/release-notes.md --verify-tag $prerelease
